name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Stage only the public site. Uploading the repo root would publish
      # package.json / package-lock.json (exact dependency versions), the CI
      # workflows, the Playwright suite and internal docs at predictable URLs.
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html favicon.svg robots.txt sitemap.xml _site/
          cp -R pages _site/pages
          echo "Staged:" && find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
